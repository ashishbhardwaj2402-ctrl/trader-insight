[project]
name = "trader-insight-backend"
version = "0.1.0"
description = "Python backend foundation for Trader Insight"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-cdk-lib==2.177.0",
    "boto3==1.35.99",
    "constructs==10.4.2",
    "jsonschema==4.23.0",
    "pydantic==2.10.6",
]

[project.scripts]
cdk = "trader_insight.tools.cdk:main"

[dependency-groups]
dev = [
    "hypothesis==6.124.7",
    "mypy==1.14.1",
    "pytest==8.3.4",
    "ruff==0.9.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/trader_insight"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
